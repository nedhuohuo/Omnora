  /admin/mounts/{mountId}:
    get:
      tags: [Admin]
      summary: Read mount settings, grants, and eligible space members.
      description: >
        Returns the canonical name/health fields and compatibility aliases
        displayName/status. effectivePermission is computed by the server.
      x-omnora-route-group: rest
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MountId"
      responses:
        "200":
          description: Mount access detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMountDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      summary: Update mutable mount settings.
      description: Disabling public sharing revokes active shares for this mount; switching to read-only cancels active uploads.
      x-omnora-route-group: rest
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminMountRequest"
      responses:
        "200":
          description: Updated mount detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMountDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admin]
      summary: Soft-delete a mount and invalidate its derived capabilities.
      x-omnora-route-group: rest
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MountId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deleteData:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Mount deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAdminMountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/mounts/{mountId}/grants:
    get:
      tags: [Admin]
      summary: List explicit account grants and eligible space members for a mount.
      description: A space member without an item in this collection has no content access to this mount.
      x-omnora-route-group: rest
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MountId"
      responses:
        "200":
          description: Explicit grants and eligible ungranted accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMountGrantList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/mounts/{mountId}/grants/{accountId}:
    put:
      tags: [Admin]
      summary: Create or replace one account's explicit mount grant.
      description: >
        The account must be an active member of the mount's space. Effective permission
        is the lower of spacePermission and permission and is returned by the server.
      x-omnora-route-group: rest
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MountId"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAdminMountGrantRequest"
      responses:
        "200":
          description: Current grant and server-computed effective permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMountGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Remove one account's explicit mount grant.
      description: Removing a grant revokes affected shares, cancels active uploads, and removes token boundaries for this mount.
      x-omnora-route-group: rest
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/MountId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Grant removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

