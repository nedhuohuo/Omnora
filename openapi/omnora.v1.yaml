components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AI Token or session-bound API token
    cookieAuth:
      type: apiKey
      in: cookie
      name: omnora_session
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Path:
      name: path
      in: query
      schema:
        type: string
        default: ""
      description: Normalized mount-relative directory path. Absolute paths are rejected.
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    MountId:
      name: mountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ObjectId:
      name: objectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed or credentials are not currently valid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The current authorization formula denies this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The object does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested state conflicts with current system state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The requested preview type is not supported.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    RangeNotSatisfiable:
      description: Requested byte range is outside the current file size.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required subsystem is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 128
      description: Opaque, non-host-path identifier.
    Error:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - unauthorized
            - forbidden
            - route_group_disabled
            - not_found
            - invalid_cursor
            - quota_exceeded
            - rate_limited
            - mount_identity_unverifiable
            - mount_conflict
            - mount_offline
            - readonly_mount
            - object_changed
            - preview_not_supported
            - share_password_required
            - share_invalid
            - upload_conflict
        detail:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    RouteGroupState:
      type: object
      required: [name, enabled]
      properties:
        name:
          type: string
          enum: [admin_web, member_web, share, rest, mcp, openapi]
        enabled:
          type: boolean
    Session:
      type: object
      required: [userId, expiresAt, isAdmin, capabilities]
      properties:
        userId:
          $ref: "#/components/schemas/OpaqueId"
        expiresAt:
          type: string
          format: date-time
        isAdmin:
          type: boolean
          description: Control-plane administrator identity; this does not grant mount content access.
        capabilities:
          $ref: "#/components/schemas/SessionCapabilities"
        requiresTotpEnrollment:
          type: boolean
    SessionCapabilities:
      type: object
      additionalProperties: false
      required: [memberWeb, adminWeb, hasContentAccess, manageSystem]
      properties:
        memberWeb:
          type: boolean
        adminWeb:
          type: boolean
        hasContentAccess:
          type: boolean
          description: True only when current active space membership and an explicit grant overlap on at least one active mount.
        manageSystem:
          type: boolean
          description: Control-plane capability; never substitutes for a mount grant.
    CreateSessionRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password
        totpCode:
          type: string
          minLength: 6
          maxLength: 8
    TOTPSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: One-time TOTP secret for authenticator enrollment.
        otpauthUri:
          type: string
          format: uri
    TOTPConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
    User:
      type: object
      required: [id, displayName, role, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, disabled]
    CreateUserRequest:
      type: object
      required: [displayName, initialPassword]
      properties:
        displayName:
          type: string
        initialPassword:
          type: string
          format: password
    Space:
      type: object
      required: [id, type, name, role]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        type:
          type: string
          enum: [personal, shared]
        name:
          type: string
        role:
          type: string
          enum: [viewer, editor, manager]
    SpaceAclEntry:
      type: object
      required: [userId, role]
      properties:
        userId:
          $ref: "#/components/schemas/OpaqueId"
        role:
          type: string
          enum: [viewer, editor, manager]
    Mount:
      type: object
      description: Member-visible mount summary. Only explicitly granted mounts are returned.
      required: [id, name, space, mode, index, health, tone, effectivePermission, readOnly, canWrite, canShare]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        space:
          type: string
        kind:
          type: string
          enum: [managed, external]
        mode:
          type: string
          enum: [read-only, read-write]
        index:
          type: string
          enum: [included, excluded]
        health:
          type: string
        tone:
          type: string
        effectivePermission:
          $ref: "#/components/schemas/MountPermission"
        readOnly:
          type: boolean
          description: True when the current caller cannot write, including permission or physical-mode restrictions.
        canWrite:
          type: boolean
          description: Server-derived current write capability for this caller.
        canShare:
          type: boolean
          description: Server-derived current share-create capability, including allowPublicShares.
    CreateMountRequest:
      type: object
      additionalProperties: false
      required: [spaceId, displayName, rootPath, mode, indexEnabled]
      properties:
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        displayName:
          type: string
        rootPath:
          type: string
          description: Absolute container path beneath exactly one configured managed or external storage root.
        kind:
          type: string
          enum: [managed, external]
          description: Optional compatibility hint. The server infers and validates kind from rootPath.
        mode:
          type: string
          enum: [read_only, read_write]
        indexEnabled:
          type: boolean
    AdminMountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminMountListItem"
    AdminMountListItem:
      type: object
      required: [id, name, space, mode, index, health, tone]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        space:
          type: string
        kind:
          type: string
          enum: [managed, external]
        mode:
          type: string
          enum: [read-only, read-write]
        index:
          type: string
          enum: [included, excluded]
        health:
          type: string
        tone:
          type: string
    AdminMountDetail:
      type: object
      required: [id, spaceId, spaceName, name, displayName, rootPath, kind, mode, indexEnabled, allowPublicShares, health, status, tone, grantCount, grants, eligibleAccounts]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        spaceName:
          type: string
        name:
          type: string
          description: Canonical display name used by the storage UI.
        displayName:
          type: string
          description: Compatibility alias of name.
        rootPath:
          type: string
          description: Configured absolute container path. This control-plane field does not grant content access.
        kind:
          type: string
          enum: [managed, external]
        mode:
          type: string
          enum: [read_only, read_write]
        indexEnabled:
          type: boolean
        allowPublicShares:
          type: boolean
        health:
          type: string
          description: Canonical mount state used by the storage UI.
        status:
          type: string
          description: Compatibility alias of health.
        tone:
          type: string
        grantCount:
          type: integer
          minimum: 0
        grants:
          type: array
          items:
            $ref: "#/components/schemas/AdminMountGrant"
        eligibleAccounts:
          type: array
          items:
            $ref: "#/components/schemas/AdminMountEligibleAccount"
    AdminMountGrant:
      type: object
      required: [accountId, email, displayName, spacePermission, permission, effectivePermission]
      properties:
        accountId:
          $ref: "#/components/schemas/OpaqueId"
        email:
          type: string
        displayName:
          type: string
        spacePermission:
          $ref: "#/components/schemas/MountPermission"
        permission:
          $ref: "#/components/schemas/MountPermission"
        effectivePermission:
          allOf:
            - $ref: "#/components/schemas/MountPermission"
          description: Server-computed minimum of spacePermission and permission.
    AdminMountEligibleAccount:
      type: object
      required: [accountId, email, displayName, spacePermission, permission]
      properties:
        accountId:
          $ref: "#/components/schemas/OpaqueId"
        email:
          type: string
        displayName:
          type: string
        spacePermission:
          $ref: "#/components/schemas/MountPermission"
        permission:
          type: "null"
    AdminMountGrantList:
      type: object
      required: [items, eligibleAccounts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminMountGrant"
        eligibleAccounts:
          type: array
          items:
            $ref: "#/components/schemas/AdminMountEligibleAccount"
    MountPermission:
      type: string
      enum: [viewer, editor, manager]
    PutAdminMountGrantRequest:
      type: object
      additionalProperties: false
      required: [permission]
      properties:
        permission:
          $ref: "#/components/schemas/MountPermission"
    UpdateAdminMountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
        mode:
          type: string
          enum: [read_only, read_write]
        indexEnabled:
          type: boolean
        allowPublicShares:
          type: boolean
    DeleteAdminMountResponse:
      type: object
      required: [id, deleted, deleteData, dataDeleted]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        deleted:
          type: boolean
          const: true
        deleteData:
          type: boolean
        dataDeleted:
          type: boolean
    FileObject:
      type: object
      required: [id, spaceId, mountId, name, kind, size, modifiedAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        kind:
          type: string
          enum: [file, directory]
        mediaType:
          type: string
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
            enum: [browse, preview, download, upload, copy, move, rename, delete, share]
    DirectoryListing:
      type: object
      required: [relativePath, readOnly, effectivePermission, canWrite, canShare, entries]
      properties:
        relativePath:
          type: string
        readOnly:
          type: boolean
        effectivePermission:
          $ref: "#/components/schemas/MountPermission"
        canWrite:
          type: boolean
        canShare:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"
    DirectoryEntry:
      type: object
      required: [name, relativePath, kind, size, modifiedAt, readOnly, previewKind]
      properties:
        name:
          type: string
        relativePath:
          type: string
        kind:
          type: string
          enum: [file, directory]
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        readOnly:
          type: boolean
        previewKind:
          type: string
    SearchResultPage:
      type: object
      required: [items, excludedMounts, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        excludedMounts:
          type: array
          description: Contains only excluded mounts currently authorized to the caller.
          items:
            $ref: "#/components/schemas/ExcludedSearchMount"
        nextCursor:
          type: string
    SearchResultItem:
      type: object
      required: [id, spaceId, mountId, relativePath, name, kind, previewKind, sizeBytes, modifiedAt, identityFingerprint, effectivePermission, canWrite, canShare]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        relativePath:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [file, directory]
        previewKind:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        identityFingerprint:
          type: string
        effectivePermission:
          $ref: "#/components/schemas/MountPermission"
        canWrite:
          type: boolean
        canShare:
          type: boolean
    ExcludedSearchMount:
      type: object
      required: [mountId, name, reason]
      properties:
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        reason:
          type: string
    TextPreview:
      type: object
      required: [objectId, content, truncated]
      properties:
        objectId:
          $ref: "#/components/schemas/OpaqueId"
        content:
          type: string
        truncated:
          type: boolean
        renderedMarkdown:
          type: boolean
    DownloadTicket:
      type: object
      required: [ticketId, expiresAt, url]
      properties:
        ticketId:
          $ref: "#/components/schemas/OpaqueId"
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri-reference
    CreateUploadRequest:
      type: object
      required: [spaceId, mountId, parentPath, fileName, size]
      properties:
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        parentPath:
          type: string
        fileName:
          type: string
        size:
          type: integer
          minimum: 0
    UploadSession:
      type: object
      required: [id, expiresAt, partSize]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        targetPath:
          type: string
        expectedSize:
          type: integer
          minimum: 0
        receivedSize:
          type: integer
          minimum: 0
        parts:
          type: array
          items:
            type: object
            required: [number, size]
            properties:
              number:
                type: integer
                minimum: 1
              size:
                type: integer
                minimum: 0
        expiresAt:
          type: string
          format: date-time
        partSize:
          type: integer
          minimum: 1
    Share:
      type: object
      description: Share metadata. List responses never include the one-time secret or URL fragment.
      required: [id, publicId, spaceId, mountId, relativePath, allowPreview, allowDownload, usedVisits, usedDownloads, expiresAt, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        publicId:
          type: string
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        spaceName:
          type: string
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        mountName:
          type: string
        relativePath:
          type: string
        creatorEmail:
          type: string
        creatorDisplayName:
          type: string
        status:
          type: string
          enum: [active, expired, revoked]
        allowPreview:
          type: boolean
        allowDownload:
          type: boolean
        maxVisits:
          type: integer
          minimum: 1
        usedVisits:
          type: integer
          minimum: 0
        maxDownloads:
          type: integer
          minimum: 1
        usedDownloads:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [spaceId, mountId, relativePath]
      properties:
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        relativePath:
          type: string
        password:
          type: string
          format: password
        expiresAt:
          type: string
          format: date-time
        allowPreview:
          type: boolean
          default: true
        allowDownload:
          type: boolean
          default: true
        maxVisits:
          type: integer
          minimum: 1
        maxDownloads:
          type: integer
          minimum: 1
    CreateShareResponse:
      type: object
      required: [id, publicId, secret, fragment, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        publicId:
          type: string
        secret:
          type: string
          description: One-time returned secret. The server stores only its hash and never returns it again.
        fragment:
          type: string
          description: One-time `publicId.secret` fragment value for constructing the public share URL.
        expiresAt:
          type: string
          format: date-time
    UpdateShareRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        allowPreview:
          type: boolean
        allowDownload:
          type: boolean
        maxAccesses:
          type: integer
          minimum: 1
        maxDownloads:
          type: integer
          minimum: 1
        revoked:
          type: boolean
    CreateShareSessionRequest:
      type: object
      additionalProperties: false
      required: [public_id, secret]
      properties:
        public_id:
          type: string
        secret:
          type: string
          description: One-time share secret extracted from the URL fragment and sent only in this request body.
        password:
          type: string
          format: password
    ShareSession:
      type: object
      required: [status, shareSessionId, expiresAt]
      properties:
        status:
          type: string
          const: created
        shareSessionId:
          $ref: "#/components/schemas/OpaqueId"
        expiresAt:
          type: string
          format: date-time
    AiToken:
      type: object
      required: [id, name, scopes, expiresAt, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        scopes:
          type: array
          description: First-version AI Token scopes are read-only; upload endpoints require a browser session.
          items:
            type: string
            enum: ["spaces:read", "files:list", "files:metadata", "files:text", "files:download_ticket", "search:read"]
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked, expired]
    CreateAiTokenRequest:
      type: object
      required: [name, scopes, boundaries, expiresAt]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["spaces:read", "files:list", "files:metadata", "files:text", "files:download_ticket", "search:read"]
        boundaries:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryBoundary"
        expiresAt:
          type: string
          format: date-time
    CreateAiTokenResponse:
      type: object
      required: [token, secret, bearerToken]
      properties:
        token:
          $ref: "#/components/schemas/AiToken"
        secret:
          type: string
          description: One-time returned token secret.
        bearerToken:
          type: string
          description: One-time returned Authorization bearer value.
    DirectoryBoundary:
      type: object
      required: [spaceId, mountId, path]
      properties:
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        path:
          type: string
    Job:
      type: object
      required: [id, kind, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          type: string
          enum: [catalog_scan]
        status:
          type: string
          enum: [queued, running, paused, failed, completed, canceled]
        spaceName:
          type: string
        mountName:
          type: string
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        lastError:
          type: string
    AuditEvent:
      type: object
      required: [occurredAt, actor, actorLabel, action, targetType, targetId, targetLabel, metadata]
      properties:
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        actorEmail:
          type: string
          format: email
        actorDisplayName:
          type: string
