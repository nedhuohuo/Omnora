# Minimal Omnora single-container deployment example.
# Replace the image tag with the first published release image when available.
services:
  omnora:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    image: omnora:aliyun-test
    container_name: omnora
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    ports:
      # Bind to 127.0.0.1 for local/reverse-proxy-only access, or a private/public
      # host address when the service should be reachable directly.
      - "${OMNORA_BIND:-127.0.0.1}:8080:8080"
    environment:
      TZ: "${TZ:-UTC}"
      UMASK: "${UMASK:-0027}"
      OMNORA_CONFIG_DIR: /etc/omnora
      OMNORA_DATA_DIR: /var/lib/omnora
      OMNORA_DB_PATH: /var/lib/omnora/omnora.db
      OMNORA_HTTP_ADDR: 0.0.0.0:8080
      OMNORA_LOG_FORMAT: "${OMNORA_LOG_FORMAT:-json}"
      OMNORA_LOG_LEVEL: "${OMNORA_LOG_LEVEL:-info}"
      # Leave the secrets empty to let the image entrypoint generate and persist
      # them in ./config/runtime.env.
      OMNORA_INITIALIZATION_TOKEN: "${OMNORA_INITIALIZATION_TOKEN:-}"
      OMNORA_INITIALIZATION_TOKEN_TTL: "${OMNORA_INITIALIZATION_TOKEN_TTL:-30m}"
      OMNORA_TOTP_ENCRYPTION_KEY: "${OMNORA_TOTP_ENCRYPTION_KEY:-}"
      OMNORA_MANAGED_STORAGE_DIR: /srv/omnora/managed
      OMNORA_PREDECLARED_MOUNT_ROOT: /mnt/omnora
      OMNORA_ROUTE_ADMIN_WEB_ENABLED: "${OMNORA_ROUTE_ADMIN_WEB_ENABLED:-true}"
      OMNORA_ROUTE_MEMBER_WEB_ENABLED: "${OMNORA_ROUTE_MEMBER_WEB_ENABLED:-true}"
      OMNORA_ROUTE_SHARE_ENABLED: "${OMNORA_ROUTE_SHARE_ENABLED:-false}"
      OMNORA_ROUTE_REST_ENABLED: "${OMNORA_ROUTE_REST_ENABLED:-true}"
      OMNORA_ROUTE_MCP_ENABLED: "${OMNORA_ROUTE_MCP_ENABLED:-false}"
      OMNORA_ROUTE_OPENAPI_ENABLED: "${OMNORA_ROUTE_OPENAPI_ENABLED:-true}"
    volumes:
      # Keep these host directories stable across reinstall/container recreation.
      # The entrypoint writes a shared instance marker to config and data and
      # refuses to start if those bind mounts no longer belong to one instance.
      - ./config:/etc/omnora
      - ./data:/var/lib/omnora
      - ./managed:/srv/omnora/managed:rw
      # Keep the predeclared mount root writable at container startup. Omnora
      # applies each registered mount's read_only/read_write policy in code.
      - ./mounts:/mnt/omnora:rw
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging:
      driver: local
      options:
        max-size: "${OMNORA_LOG_MAX_SIZE:-10m}"
        max-file: "${OMNORA_LOG_MAX_FILE:-5}"
