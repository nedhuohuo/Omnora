# Aliyun ECS test-server override for the base Omnora Compose file.
# Use with:
#   docker compose --env-file aliyun-test.env -f docker-compose.yml -f docker-compose.aliyun-test.yml up -d
services:
  omnora:
    container_name: omnora-aliyun-test
    labels:
      omnora.environment: aliyun-test
      omnora.role: test-server
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      OMNORA_DEPLOY_ENV: aliyun-test
      OMNORA_AUDIT_HMAC_KEY: "${OMNORA_AUDIT_HMAC_KEY:-}"
      OMNORA_MCP_ALLOWED_HOSTS: "${OMNORA_MCP_ALLOWED_HOSTS:-}"
      OMNORA_MCP_ALLOWED_ORIGINS: "${OMNORA_MCP_ALLOWED_ORIGINS:-}"
      OMNORA_MCP_MAX_BODY_BYTES: "${OMNORA_MCP_MAX_BODY_BYTES:-1048576}"
      OMNORA_ROUTE_SHARE_ENABLED: "${OMNORA_ROUTE_SHARE_ENABLED:-false}"
      OMNORA_ROUTE_MCP_ENABLED: "${OMNORA_ROUTE_MCP_ENABLED:-false}"
    volumes:
      - ./aliyun-test/config:/etc/omnora
      - ./aliyun-test/data:/var/lib/omnora
      - ./aliyun-test/managed:/srv/omnora/managed:rw
      # Keep the predeclared root writable; Omnora applies the selected mount
      # mode when the administrator registers each child directory.
      - ./aliyun-test/mounts:/mnt/omnora:rw
