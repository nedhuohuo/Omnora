# Aliyun ECS test-server override for the base Omnora Compose file.
# Use with:
#   docker compose --env-file aliyun-test.env -f docker-compose.yml -f docker-compose.aliyun-test.yml up -d
services:
  omnora:
    container_name: omnora-aliyun-test
    labels:
      omnora.environment: aliyun-test
      omnora.role: test-server
    ports:
      # Aliyun test env sets OMNORA_LAN_BIND=0.0.0.0 for external HTTP on 8080.
      # Keep proxy_https on 127.0.0.1 unless a TLS reverse proxy is configured.
      - "${OMNORA_LAN_BIND:-0.0.0.0}:8080:8080"
      - "${OMNORA_PROXY_BIND:-127.0.0.1}:8081:8081"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      OMNORA_DEPLOY_ENV: aliyun-test
      OMNORA_LAN_HTTP_ALLOWED_CIDRS: "${OMNORA_LAN_HTTP_ALLOWED_CIDRS:-0.0.0.0/0,::/0}"
      OMNORA_PROXY_HTTPS_ENABLED: "${OMNORA_PROXY_HTTPS_ENABLED:-false}"
      OMNORA_ROUTE_SHARE_ENABLED: "${OMNORA_ROUTE_SHARE_ENABLED:-false}"
      OMNORA_ROUTE_MCP_ENABLED: "${OMNORA_ROUTE_MCP_ENABLED:-false}"
    volumes:
      - ./aliyun-test/config:/etc/omnora
      - ./aliyun-test/data:/var/lib/omnora
      - ./aliyun-test/managed:/srv/omnora/managed
      # Aliyun test intentionally mounts external dirs read-write so folder create
      # and upload can be exercised. Production should keep external mounts :ro
      # unless write access is deliberately required.
      - ./aliyun-test/mounts:/mnt/omnora
