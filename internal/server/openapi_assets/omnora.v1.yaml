openapi: 3.1.0
info:
  title: Omnora REST API
  version: 0.1.0-starter
  summary: Starter OpenAPI contract for the first Omnora version.
  description: >
    Contract aligned to the runnable Omnora control-plane REST surface.
    Stale starter paths are marked x-omnora-stale and should not be used by new clients.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
x-omnora-route-groups:
  - admin_web
  - member_web
  - share
  - rest
  - mcp
  - openapi
security:
  - cookieSession: []
tags:
  - name: System
  - name: Identity
  - name: Spaces
  - name: Files
  - name: Search
  - name: Transfers
  - name: Shares
  - name: AI Tokens
  - name: Admin
  - name: Audit
  - name: MCP
paths:
  /healthz:
    get:
      tags: [System]
      summary: Return process health.
      servers:
        - url: /
      x-omnora-route-group: none
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [System]
      summary: Return readiness after database checks.
      servers:
        - url: /
      x-omnora-route-group: none
      security: []
      responses:
        "200":
          description: The process is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /health:
    x-omnora-stale: true
    get:
      tags: [System]
      summary: Return process health.
      x-omnora-route-group: rest
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /route-groups:
    x-omnora-stale: true
    get:
      tags: [System]
      summary: Return route group exposure state visible to the caller.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Route group state.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/RouteGroupState"
  /auth/session:
    get:
      tags: [Identity]
      summary: Return the current browser session subject.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Identity]
      summary: Create a browser session after password and required TOTP checks.
      x-omnora-route-group: rest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Identity]
      summary: Revoke the current browser session.
      x-omnora-route-group: rest
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/totp/setup:
    post:
      tags: [Identity]
      summary: Create an encrypted TOTP secret for the current account.
      description: Requires OMNORA_TOTP_ENCRYPTION_KEY and returns the setup secret only once.
      x-omnora-route-group: rest
      responses:
        "201":
          description: TOTP setup material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        "409":
          $ref: "#/components/responses/Conflict"
  /account/totp/confirm:
    post:
      tags: [Identity]
      summary: Confirm the current TOTP secret and require TOTP on future login.
      x-omnora-route-group: rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPConfirmRequest"
      responses:
        "200":
          description: TOTP enabled.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /spaces:
    get:
      tags: [Spaces]
      summary: List spaces available to the current subject.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Spaces.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Space"
                  nextCursor:
                    type: string
  /spaces/{spaceId}:
    x-omnora-stale: true
    get:
      tags: [Spaces]
      summary: Read one space and the caller's effective role.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Space.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "404":
          $ref: "#/components/responses/NotFound"
  /spaces/{spaceId}/acl:
    x-omnora-stale: true
    get:
      tags: [Spaces]
      summary: List space ACL entries.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: ACL entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpaceAclEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Spaces]
      summary: Replace space ACL entries.
      description: Requires manager role in the target space; does not grant mount administration.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/SpaceAclEntry"
      responses:
        "200":
          description: ACL updated.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpaceAclEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spaces/{spaceId}/mounts:
    get:
      tags: [Spaces]
      summary: List mounts in a space.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Mounts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mount"
  /spaces/{spaceId}/mounts/{mountId}/children:
    get:
      tags: [Files]
      summary: List files and directories below a mount-relative directory.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/MountId"
        - $ref: "#/components/parameters/Path"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /spaces/{spaceId}/mounts/{mountId}/download:
    get:
      tags: [Transfers]
      summary: Download a mount-relative file, including HTTP Range requests.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/MountId"
        - $ref: "#/components/parameters/Path"
        - name: Range
          in: header
          schema:
            type: string
            example: bytes=0-1023
      responses:
        "200":
          description: Complete file body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial file body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
  /spaces/{spaceId}/search:
    get:
      tags: [Search]
      summary: Search indexed metadata within an authorized space.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: type
          in: query
          schema:
            type: string
            enum: [file, directory, image, pdf, text, markdown, audio, video, office, other]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Search results and excluded mounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultPage"
  /files/{objectId}:
    x-omnora-stale: true
    get:
      tags: [Files]
      summary: Read current metadata for one file object.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: File object metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
        "404":
          $ref: "#/components/responses/NotFound"
  /files/{objectId}/text:
    x-omnora-stale: true
    get:
      tags: [Files]
      summary: Read bounded text or Markdown preview content.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: maxBytes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1048576
            default: 65536
      responses:
        "200":
          description: Bounded text content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextPreview"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /files/{objectId}/download-ticket:
    x-omnora-stale: true
    post:
      tags: [Transfers]
      summary: Create a short-lived download ticket for a single object.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "201":
          description: Download ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTicket"
  /downloads/{ticketId}:
    x-omnora-stale: true
    get:
      tags: [Transfers]
      summary: Download content by short-lived ticket, including Range requests.
      x-omnora-route-group: rest
      security: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Complete file body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial file body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
  /uploads:
    post:
      tags: [Transfers]
      summary: Create a resumable upload session.
      description: Current REST upload handlers require an authenticated browser session and current write permission. AI Token upload scope is a declared target for future REST bearer integration.
      x-omnora-route-group: rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /uploads/{uploadId}/parts/{partNumber}:
    put:
      tags: [Transfers]
      summary: Upload one part of a resumable upload session.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: partNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Part accepted.
  /uploads/{uploadId}/complete:
    post:
      tags: [Transfers]
      summary: Complete an upload after all required parts have been received.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Created file object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
        "409":
          $ref: "#/components/responses/Conflict"
  /uploads/{uploadId}:
    get:
      tags: [Transfers]
      summary: Resume a resumable upload session and list accepted parts.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Upload session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
    delete:
      tags: [Transfers]
      summary: Cancel an upload session and release reserved quota.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "204":
          description: Upload canceled.
  /shares:
    get:
      tags: [Shares]
      summary: List shares visible to the caller.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Shares.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Share"
    post:
      tags: [Shares]
      summary: Create a share for a file or folder.
      description: Requires current manager role in the target space. The returned secret is shown once.
      x-omnora-route-group: rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Share created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShareResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /shares/{shareId}:
    x-omnora-stale: true
    get:
      tags: [Shares]
      summary: Read share metadata.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "200":
          description: Share metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
    patch:
      tags: [Shares]
      summary: Update share limits or revoke state.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/ShareId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShareRequest"
      responses:
        "200":
          description: Share updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
    delete:
      tags: [Shares]
      summary: Revoke a share.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204":
          description: Share revoked.
  /share-sessions:
    post:
      tags: [Shares]
      summary: Exchange a share URL fragment secret for a short-lived share session.
      description: The secret is accepted only in this POST body, never in path, query, or Referer.
      x-omnora-route-group: share
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareSessionRequest"
      responses:
        "201":
          description: Share session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ai-tokens:
    get:
      tags: [AI Tokens]
      summary: List AI Token metadata for the current member.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Token metadata.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiToken"
    post:
      tags: [AI Tokens]
      summary: Create an AI Token with explicit scopes and directory boundaries.
      x-omnora-route-group: rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiTokenRequest"
      responses:
        "201":
          description: Token created. The secret is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAiTokenResponse"
  /ai-tokens/{tokenId}:
    delete:
      tags: [AI Tokens]
      summary: Revoke an AI Token.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204":
          description: Token revoked.
  /admin/users:
    get:
      tags: [Admin]
      summary: List users.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
    post:
      tags: [Admin]
      summary: Create a member account and its personal space.
      x-omnora-route-group: rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/mounts:
    get:
      tags: [Admin]
      summary: List all mounts across spaces for administrators.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Mount list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      summary: Register a predeclared container path as a space mount.
      description: Only system administrators can register mounts; unverifiable identity returns mount_identity_unverifiable.
      x-omnora-route-group: rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMountRequest"
      responses:
        "201":
          description: Mount registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/index-jobs:
    get:
      tags: [Admin]
      summary: List indexing and reconciliation jobs.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      tags: [Admin]
      summary: Queue a catalog scan job for one mount.
      x-omnora-route-group: rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mountId]
              properties:
                mountId:
                  $ref: "#/components/schemas/OpaqueId"
      responses:
        "201":
          description: Job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /admin/index-jobs/{jobId}/run:
    post:
      tags: [Admin]
      summary: Claim and run one queued catalog scan job inline.
      x-omnora-route-group: rest
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/OpaqueId"
      responses:
        "200":
          description: Catalog scan batch result.
          content:
            application/json:
              schema:
                type: object
        "409":
          $ref: "#/components/responses/Conflict"
  /audit/events:
    get:
      tags: [Audit]
      summary: List audit events visible to the caller.
      x-omnora-route-group: rest
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Audit events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  nextCursor:
                    type: string
  /mcp:
    post:
      tags: [MCP]
      summary: Call the current HTTP MCP adapter.
      description: >
        The current implementation accepts a method-plus-params JSON request and
        returns a JSON response. It exposes the read-only first-version methods
        tools/list, spaces.list, files.search, files.list, files.metadata, and
        files.read_text. This endpoint is not yet documented as a completed
        standards-compatible Streamable HTTP MCP transport.
      servers:
        - url: /
      x-omnora-route-group: mcp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [tools/list, spaces.list, files.search, files.list, files.metadata, files.read_text]
                params:
                  type: object
                  additionalProperties: true
                  default: {}
      responses:
        "200":
          description: JSON response for the selected current adapter method.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /account:
    get:
      tags: [Identity]
      summary: Implemented endpoint GET /account.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/password:
    patch:
      tags: [Identity]
      summary: Implemented endpoint PATCH /account/password.
      x-omnora-route-group: rest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/preferences:
    get:
      tags: [Identity]
      summary: Implemented endpoint GET /account/preferences.
      x-omnora-route-group: rest
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Identity]
