components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AI Token for the current MCP adapter
    cookieSession:
      type: apiKey
      in: cookie
      name: omnora_session
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Path:
      name: path
      in: query
      schema:
        type: string
        default: ""
      description: Normalized mount-relative directory path. Absolute paths are rejected.
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    MountId:
      name: mountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ObjectId:
      name: objectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
  responses:
    Unauthorized:
      description: Authentication failed or credentials are not currently valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The current authorization formula denies this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The object does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested state conflicts with current system state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The requested preview type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RangeNotSatisfiable:
      description: Requested byte range is outside the current file size.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required subsystem is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    OpaqueId:
      type: string
      minLength: 8
      maxLength: 128
      description: Opaque, non-host-path identifier.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: >
                Stable machine-readable error code. Known values include
                unauthorized, forbidden, route_group_disabled, not_found,
                invalid_input, invalid_json, invalid_cursor, quota_exceeded,
                rate_limited, mount_identity_unverifiable, mount_conflict,
                mount_offline, readonly_mount, object_changed,
                preview_not_supported, share_password_required, share_invalid,
                upload_conflict, totp_required, initial_admin_protected,
                mount_root_not_allowed, and not_implemented.
            message:
              type: string
              description: Human-readable error message safe to show to the caller.
            request_id:
              type: string
              description: Request correlation identifier; it is not a credential.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    RouteGroupState:
      type: object
      required: [name, enabled]
      properties:
        name:
          type: string
          enum: [admin_web, member_web, share, rest, mcp, openapi]
        enabled:
          type: boolean
    Session:
      type: object
      required: [userId, expiresAt]
      properties:
        userId:
          $ref: "#/components/schemas/OpaqueId"
        expiresAt:
          type: string
          format: date-time
        requiresTotpEnrollment:
          type: boolean
    CreateSessionRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password
        totpCode:
          type: string
          minLength: 6
          maxLength: 8
    TOTPSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: One-time TOTP secret for authenticator enrollment.
        otpauthUri:
          type: string
          format: uri
    TOTPConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
    User:
      type: object
      required: [id, displayName, role, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, disabled]
        protected:
          type: boolean
          description: Whether this is the initial administrator account and cannot be disabled or removed from space ACLs.
    CreateUserRequest:
      type: object
      required: [displayName, initialPassword]
      properties:
        displayName:
          type: string
        initialPassword:
          type: string
          format: password
    Space:
      type: object
      required: [id, type, name, role]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        type:
          type: string
          enum: [personal, shared]
        name:
          type: string
        role:
          type: string
          enum: [viewer, editor, manager]
    SpaceAclEntry:
      type: object
      required: [userId, role]
      properties:
        userId:
          $ref: "#/components/schemas/OpaqueId"
        role:
          type: string
          enum: [viewer, editor, manager]
    AdminSpaceMember:
      type: object
      required: [accountId, email, displayName, permission, protected]
      properties:
        accountId:
          $ref: "#/components/schemas/OpaqueId"
        email:
          type: string
          format: email
        displayName:
          type: string
        permission:
          type: string
          enum: [viewer, editor, manager]
        protected:
          type: boolean
          description: Whether this is the initial administrator account whose space membership cannot be changed or removed.
    HostDirectorySuggestions:
      type: object
      required: [roots, rootDetails, path, entries]
      properties:
        roots:
          type: array
          items:
            type: string
        rootDetails:
          type: array
          items:
            $ref: "#/components/schemas/HostDirectoryRoot"
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HostDirectoryEntry"
    HostDirectoryRoot:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
        kind:
          type: string
          enum: [managed, external]
    HostDirectoryEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [managed, external]
    Mount:
      type: object
      required: [id, spaceId, name, mode, indexMode, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        mode:
          type: string
          enum: [read_only, read_write]
        indexMode:
          type: string
          enum: [disabled, enabled, paused]
        status:
          type: string
          enum: [active, offline, readonly_drift, identity_drift, identity_unverifiable, conflict, disabled]
    MountDeletion:
      type: object
      required: [id, deleted, deleteData, dataDeleted]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        deleted:
          type: boolean
          const: true
        deleteData:
          type: boolean
          const: false
        dataDeleted:
          type: boolean
          const: false
    CreateMountRequest:
      type: object
      required: [spaceId, name, containerPath, mode, indexMode]
      properties:
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        containerPath:
          type: string
          description: Absolute path under the predeclared mount root inside the container.
        mode:
          type: string
          enum: [read_only, read_write]
        indexMode:
          type: string
          enum: [disabled, enabled]
    FileObject:
      type: object
      required: [id, spaceId, mountId, name, kind, size, modifiedAt]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        kind:
          type: string
          enum: [file, directory]
        mediaType:
          type: string
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
            enum: [browse, preview, download, upload, copy, move, rename, delete, share]
    DirectoryListing:
      type: object
      required: [mount, path, items]
      properties:
        mount:
          $ref: "#/components/schemas/Mount"
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileObject"
        nextCursor:
          type: string
    SearchResultPage:
      type: object
      required: [items, excludedMounts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileObject"
        excludedMounts:
          type: array
          items:
            type: object
            required: [mountId, reason]
            properties:
              mountId:
                $ref: "#/components/schemas/OpaqueId"
              reason:
                type: string
                enum: [index_disabled, index_paused, offline, initial_scan_incomplete, identity_unverifiable]
        nextCursor:
          type: string
    TextPreview:
      type: object
      required: [objectId, content, truncated]
      properties:
        objectId:
          $ref: "#/components/schemas/OpaqueId"
        content:
          type: string
        truncated:
          type: boolean
        renderedMarkdown:
          type: boolean
    DownloadTicket:
      type: object
      required: [ticketId, expiresAt, url]
      properties:
        ticketId:
          $ref: "#/components/schemas/OpaqueId"
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri-reference
    CreateUploadRequest:
      type: object
      required: [spaceId, mountId, parentPath, fileName, size]
      properties:
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        parentPath:
          type: string
        fileName:
          type: string
        size:
          type: integer
          minimum: 0
    UploadSession:
      type: object
      required: [id, expiresAt, partSize]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        targetPath:
          type: string
        expectedSize:
          type: integer
          minimum: 0
        receivedSize:
          type: integer
          minimum: 0
        parts:
          type: array
          items:
            type: object
            required: [number, size]
            properties:
              number:
                type: integer
                minimum: 1
              size:
                type: integer
                minimum: 0
        expiresAt:
          type: string
          format: date-time
        partSize:
          type: integer
          minimum: 1
    Share:
      type: object
      required: [id, targetObjectId, status, allowPreview, allowDownload]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        fragment:
          type: string
          description: Full URL fragment that can be opened under /share# when the link secret is available.
        targetObjectId:
          $ref: "#/components/schemas/OpaqueId"
        status:
          type: string
          enum: [active, expired, revoked, invalidated]
        allowPreview:
          type: boolean
        allowDownload:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    CreateShareRequest:
      type: object
      required: [targetObjectId, allowPreview, allowDownload]
      properties:
        targetObjectId:
          $ref: "#/components/schemas/OpaqueId"
        password:
          type: string
          format: password
        expiresAt:
          type: string
          format: date-time
        allowPreview:
          type: boolean
        allowDownload:
          type: boolean
        maxAccesses:
          type: integer
          minimum: 1
        maxDownloads:
          type: integer
          minimum: 1
    CreateShareResponse:
      type: object
      required: [share, publicId, fragmentSecret]
      properties:
        share:
          $ref: "#/components/schemas/Share"
        publicId:
          type: string
        fragmentSecret:
          type: string
          description: One-time returned secret intended for the URL fragment.
    UpdateShareRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        allowPreview:
          type: boolean
        allowDownload:
          type: boolean
        maxAccesses:
          type: integer
          minimum: 1
        maxDownloads:
          type: integer
          minimum: 1
        revoked:
          type: boolean
    CreateShareSessionRequest:
      type: object
      required: [publicId, fragmentSecret]
      properties:
        publicId:
          type: string
        fragmentSecret:
          type: string
        password:
          type: string
          format: password
    ShareSession:
      type: object
      required: [shareId, expiresAt]
      properties:
        shareId:
          $ref: "#/components/schemas/OpaqueId"
        expiresAt:
          type: string
          format: date-time
    AiToken:
      type: object
      required: [id, name, scopes, expiresAt, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["spaces:read", "files:list", "files:metadata", "files:text", "files:download_ticket", "search:read", "uploads:create"]
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked, expired]
    CreateAiTokenRequest:
      type: object
      required: [name, scopes, boundaries, expiresAt]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["spaces:read", "files:list", "files:metadata", "files:text", "files:download_ticket", "search:read", "uploads:create"]
        boundaries:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryBoundary"
        expiresAt:
          type: string
          format: date-time
    CreateAiTokenResponse:
      type: object
      required: [token, secret, bearerToken]
      properties:
        token:
          $ref: "#/components/schemas/AiToken"
        secret:
          type: string
          description: One-time returned token secret.
        bearerToken:
          type: string
          description: One-time returned Authorization bearer value.
    DirectoryBoundary:
      type: object
      required: [spaceId, mountId, path]
      properties:
        spaceId:
          $ref: "#/components/schemas/OpaqueId"
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        path:
          type: string
    Job:
      type: object
      required: [id, kind, status]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          type: string
          enum: [catalog_scan]
        status:
          type: string
          enum: [queued, running, paused, failed, completed, canceled]
        spaceName:
          type: string
        mountName:
          type: string
        mountId:
          $ref: "#/components/schemas/OpaqueId"
        lastError:
          type: string
    AuditEvent:
      type: object
      required: [occurredAt, actor, actorLabel, action, targetType, targetId, targetLabel, metadata]
      properties:
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        actorEmail:
          type: string
          format: email
        actorDisplayName:
          type: string
        actorLabel:
          type: string
        routeGroup:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        targetLabel:
          type: string
        metadata:
          type: string
